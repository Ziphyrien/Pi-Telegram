name: Dependency Auto Merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dependabot pull request number
        required: true
        type: string
      head_sha:
        description: Expected pull request head SHA
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find and verify Dependabot pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            RUN_SHA="$INPUT_HEAD_SHA"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            RUN_SHA="$EVENT_HEAD_SHA"
          fi

          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER="$(
              gh api "repos/$REPOSITORY/commits/$RUN_SHA/pulls" \
                --jq 'map(select(.state == "open")) | first | .number // empty'
            )"
          fi

          if [[ -z "$PR_NUMBER" || -z "$RUN_SHA" ]]; then
            echo "A pull request number and head SHA are required."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          endpoint="repos/$REPOSITORY/pulls/$PR_NUMBER"
          actor="$(gh api "$endpoint" --jq '.user.login')"
          state="$(gh api "$endpoint" --jq '.state')"
          head_sha="$(gh api "$endpoint" --jq '.head.sha')"
          head_ref="$(gh api "$endpoint" --jq '.head.ref')"

          if [[ "$actor" != "dependabot[bot]" ]]; then
            echo "The pull request is not authored by Dependabot."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_ref" != dependabot/* ]]; then
            echo "The pull request is not on a Dependabot branch."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$state" != "open" || "$head_sha" != "$RUN_SHA" ]]; then
            echo "The pull request is closed or its head changed after this run."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "merge=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for the dispatched CI run
        if: github.event_name == 'workflow_dispatch' && steps.pull-request.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_SHA: ${{ steps.pull-request.outputs.sha }}
        run: |
          for attempt in {1..60}; do
            ci_state="$(
              gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?per_page=100" \
                --jq '.workflow_runs | map(select(.head_sha == "'"$RUN_SHA"'")) | if any(.[]; .conclusion == "success") then "success" elif any(.[]; .status != "completed") then "pending" elif length > 0 then "failure" else "missing" end'
            )"
            echo "Synchronized CI state: $ci_state"

            if [[ "$ci_state" == "success" ]]; then
              exit 0
            fi
            if [[ "$ci_state" == "failure" ]]; then
              echo "The synchronized CI run did not succeed."
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for the synchronized CI run."
          exit 1

      - name: Merge Dependabot pull request
        if: steps.pull-request.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ steps.pull-request.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pull-request.outputs.sha }}
        run: |
          current_head_sha="$(gh api "repos/$REPOSITORY/pulls/$NUMBER" --jq '.head.sha')"
          if [[ "$current_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "The pull request head changed before merge."
            exit 1
          fi

          gh pr merge "$NUMBER" --repo "$REPOSITORY" --squash --delete-branch
